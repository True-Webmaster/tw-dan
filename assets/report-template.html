<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Human in the Loop map</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14191f;--muted:#5b6672;--line:#d9dee4;--accent:#0679c2;--accent-soft:#e3f1fb;--good:#1f8a5b;--good-soft:#e2f4ea;--bad:#c0392b;--bad-soft:#fbe7e4;--warn:#9a6a00;--warn-soft:#fbf1d9;--shadow:0 1px 3px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0b1117;--card:#121a22;--ink:#eef2f5;--muted:#9aa7b3;--line:#26323d;--accent:#3fb0f5;--accent-soft:#0f2c40;--good:#4cc68f;--good-soft:#11301f;--bad:#ff8a7a;--bad-soft:#3a1714;--warn:#f1c969;--warn-soft:#352a0c;--shadow:none}}
*{box-sizing:border-box}
html{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{margin:0}
main{max-width:1080px;margin:0 auto;padding:40px 20px 80px}
h1{font-size:clamp(28px,4vw,40px);line-height:1.15;margin:6px 0 10px;letter-spacing:-.5px}
h2{font-size:22px;margin:0 0 4px}
h3{font-size:17px;margin:0 0 6px}
p{margin:0 0 10px}
.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);font-weight:700}
.problem{font-size:18px;color:var(--muted);max-width:800px}
.meta{font-size:13px;color:var(--muted);margin-top:6px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;margin:22px 0;box-shadow:var(--shadow)}
.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-num{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--accent);text-transform:uppercase}
.takeaway{color:var(--muted);font-size:15px;margin-bottom:16px}
.summary{border-left:4px solid var(--accent)}
.summary ol{margin:0;padding-left:20px;font-size:17px}
.summary li{margin:6px 0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--bg)}
.card .why{font-size:14px;color:var(--muted)}
.col-title{font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px}
.keep .col-title{color:var(--good)}.aside .col-title{color:var(--muted)}
.keep .card{border-left:4px solid var(--good)}.aside .card{opacity:.85}
.badge{display:inline-block;white-space:nowrap;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:999px;vertical-align:middle}
.b-yes{background:var(--good-soft);color:var(--good)}.b-no{background:var(--line);color:var(--muted)}
.b-pass{background:var(--good-soft);color:var(--good)}.b-fail{background:var(--bad-soft);color:var(--bad)}.b-unknown{background:var(--warn-soft);color:var(--warn)}
.b-strong{background:var(--accent-soft);color:var(--accent)}
.diagram{width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px}
.diagram svg{display:block;max-width:none}
.diagram svg text{fill:var(--ink);font:13px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.diagram svg .sub{fill:var(--muted);font-size:11.5px}
.diagram svg .node{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.diagram svg .node.root{stroke:var(--accent);stroke-width:2.5}
.diagram svg .node.warn{stroke:var(--bad);stroke-width:2.5}
.diagram svg .meta{fill:var(--accent);font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.facts{margin:0 0 4px;padding-left:0;list-style:none}.facts li{margin:5px 0}
.hyp.confirmed{border-left:4px solid var(--good)}
.assume .why,.questions .why{display:block}
.diagram svg .edge{fill:none;stroke:var(--accent);stroke-width:1.6;opacity:.75}
.diagram svg .col{fill:var(--muted);font-size:11px;font-weight:700;letter-spacing:1.5px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:2px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td a{color:var(--accent)}
.table-wrap{overflow-x:auto}
.depends .card{border-left:4px solid var(--warn)}
.if{font-size:14px;margin-top:6px}.if b{color:var(--accent)}
.assume li,.questions li{margin:4px 0}
.next{border:2px solid var(--accent);background:var(--accent-soft)}
.next p{font-size:18px;font-weight:600;margin:0}
.legend{font-size:13px;color:var(--muted);margin-top:8px}
footer{font-size:12px;color:var(--muted);text-align:center;margin-top:30px}
.fallback{font-size:14px;color:var(--muted)}
.levels{display:flex;align-items:center;gap:6px;margin:6px 0 12px;font-size:14px;color:var(--muted)}
.levels button{font:inherit;font-weight:700;min-width:36px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.levels button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tree-box .tree{list-style:none;margin:0;padding:0}
.tree-box .tree .tree{margin-left:18px;padding-left:16px;border-left:2px solid var(--line)}
.tree-box li{margin:8px 0}
.tnode{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.tnode .tq{color:var(--muted)}
.tnode .why{font-size:13px;color:var(--muted);margin-top:2px}
.lvl{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1px;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 5px;margin-right:8px;vertical-align:1px}
.tree-box[data-show="1"] li[data-level="2"],.tree-box[data-show="1"] li[data-level="3"],.tree-box[data-show="2"] li[data-level="3"]{display:none}
.blind .card{border-left:4px solid var(--bad)}
.gapcard{border-left:4px solid var(--accent)}
.hyp h3 .badge{margin-left:4px}
.stepback .col-title{color:var(--accent)}
.stepback .warn{border-left:4px solid var(--warn)}
.stepback .warn .col-title{color:var(--warn)}
@media print{section{break-inside:avoid;box-shadow:none}html{background:#fff}}
</style>
</head>
